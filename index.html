</head>

<body>

<header>
    <h1>ClinicAgenda</h1>
    <p>Sistema de gerenciamento de clínicas</p>
</header>

<main>

```
<h2>Cadastro de pacientes</h2>

<form class="formulario" id="formulario-paciente">

    <input
        type="text"
        id="nome"
        placeholder="Nome completo"
        required
    >

    <input
        type="text"
        id="cpf"
        placeholder="CPF"
        required
    >

    <input
        type="date"
        id="data-nascimento"
        required
    >

    <input
        type="tel"
        id="telefone"
        placeholder="Telefone"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="E-mail"
        required
    >

    <button type="submit">
        Cadastrar paciente
    </button>

</form>

<section id="lista-pacientes">

    <h2>Pacientes cadastrados</h2>

    <div id="pacientes"></div>

</section>
```

</main>

<script>

    const formulario = document.getElementById("formulario-paciente");
    const listaPacientes = document.getElementById("pacientes");

    let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];

    function mostrarPacientes() {

        listaPacientes.innerHTML = "";

        pacientes.forEach(function(paciente) {

            const div = document.createElement("div");

            div.className = "paciente";

            div.innerHTML = `
                <strong>${paciente.nome}</strong><br>
                CPF: ${paciente.cpf}<br>
                Data de nascimento: ${paciente.dataNascimento}<br>
                Telefone: ${paciente.telefone}<br>
                E-mail: ${paciente.email}
            `;

            listaPacientes.appendChild(div);

        });
    }

    formulario.addEventListener("submit", function(event) {

        event.preventDefault();

        const paciente = {

            nome: document.getElementById("nome").value,

            cpf: document.getElementById("cpf").value,

            dataNascimento: document.getElementById("data-nascimento").value,

            telefone: document.getElementById("telefone").value,

            email: document.getElementById("email").value

        };

        pacientes.push(paciente);

        localStorage.setItem("pacientes", JSON.stringify(pacientes));

        formulario.reset();

        mostrarPacientes();

        alert("Paciente cadastrado com sucesso!");

    });

    mostrarPacientes();

</script>

</body>
</html>
