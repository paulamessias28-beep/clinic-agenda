</head>

<body>

<header>
    <h1>ClinicAgenda</h1>
    <p>Sistema de gerenciamento de clínicas</p>
</header>

<main>

```
<h2>Cadastro de pacientes</h2>

<form class="formulario" id="formulario-paciente">

    <input
        type="text"
        id="nome"
        placeholder="Nome completo"
        required
    >

    <input
        type="text"
        id="cpf"
        placeholder="CPF"
        required
    >

    <input
        type="date"
        id="data-nascimento"
        required
    >

    <input
        type="tel"
        id="telefone"
        placeholder="Telefone"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="E-mail"
        required
    >

    <button type="submit" id="botao-cadastro">
        Cadastrar paciente
    </button>

</form>

<section id="lista-pacientes">

    <h2>Pacientes cadastrados</h2>

    <div id="pacientes"></div>

</section>
```

</main>

<script>

    const formulario = document.getElementById("formulario-paciente");
    const listaPacientes = document.getElementById("pacientes");
    const botaoCadastro = document.getElementById("botao-cadastro");

    let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];

    let pacienteEditando = null;


    function mostrarPacientes() {

        listaPacientes.innerHTML = "";

        pacientes.forEach(function(paciente, indice) {

            const div = document.createElement("div");

            div.className = "paciente";

            div.innerHTML = `
                <strong>${paciente.nome}</strong><br>
                CPF: ${paciente.cpf}<br>
                Data de nascimento: ${paciente.dataNascimento}<br>
                Telefone: ${paciente.telefone}<br>
                E-mail: ${paciente.email}

                <div class="botoes">

                    <button
                        class="editar"
                        onclick="editarPaciente(${indice})">
                        Editar
                    </button>

                    <button
                        class="excluir"
                        onclick="excluirPaciente(${indice})">
                        Excluir
                    </button>

                </div>
            `;

            listaPacientes.appendChild(div);

        });
    }


    formulario.addEventListener("submit", function(event) {

        event.preventDefault();

        const paciente = {

            nome: document.getElementById("nome").value,

            cpf: document.getElementById("cpf").value,

            dataNascimento: document.getElementById("data-nascimento").value,

            telefone: document.getElementById("telefone").value,

            email: document.getElementById("email").value

        };


        if (pacienteEditando === null) {

            pacientes.push(paciente);

            alert("Paciente cadastrado com sucesso!");

        } else {

            pacientes[pacienteEditando] = paciente;

            pacienteEditando = null;

            botaoCadastro.textContent = "Cadastrar paciente";

            alert("Paciente atualizado com sucesso!");

        }


        localStorage.setItem("pacientes", JSON.stringify(pacientes));

        formulario.reset();

        mostrarPacientes();

    });


    function editarPaciente(indice) {

        const paciente = pacientes[indice];

        document.getElementById("nome").value = paciente.nome;

        document.getElementById("cpf").value = paciente.cpf;

        document.getElementById("data-nascimento").value = paciente.dataNascimento;

        document.getElementById("telefone").value = paciente.telefone;

        document.getElementById("email").value = paciente.email;

        pacienteEditando = indice;

        botaoCadastro.textContent = "Salvar alterações";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function excluirPaciente(indice) {

        const confirmar = confirm(
            "Tem certeza que deseja excluir este paciente?"
        );

        if (confirmar) {

            pacientes.splice(indice, 1);

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            mostrarPacientes();

            alert("Paciente excluído com sucesso!");

        }

    }


    mostrarPacientes();

</script>

</body>
