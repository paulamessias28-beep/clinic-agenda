
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClinicAgenda</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .formulario {
            display: grid;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

<header>
    <h1>ClinicAgenda</h1>
    <p>Sistema de gerenciamento de clínicas</p>
</header>

<main>

    <h2>Cadastro de pacientes</h2>

    <form class="formulario">

        <input
            type="text"
            placeholder="Nome completo"
        >

        <input
            type="text"
            placeholder="CPF"
        >

        <input
            type="date"
        >

        <input
            type="tel"
            placeholder="Telefone"
        >

        <input
            type="email"
            placeholder="E-mail"
        >

        <button type="submit">
            Cadastrar paciente
        </button>

    </form>

</main>

</body>
</html>
