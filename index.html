<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClinicAgenda</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .formulario {
            display: grid;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .paciente {
            background-color: #f4f6f8;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .botoes {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .editar {
            background-color: #16a34a;
        }

        .excluir {
            background-color: #dc2626;
        }
    </style>

</head>

<body>

<header>

    <h1>ClinicAgenda</h1>

    <p>Sistema de gerenciamento de clínicas</p>

</header>

<main>

    <h2>Cadastro de pacientes</h2>

    <form class="formulario" id="formulario-paciente">

        <input
            type="text"
            id="nome"
            placeholder="Nome completo"
            required
        >

        <input
            type="text"
            id="cpf"
            placeholder="CPF"
            required
        >

        <input
            type="date"
            id="dataNascimento"
            required
        >

        <input
            type="tel"
            id="telefone"
            placeholder="Telefone"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            required
        >

        <button type="submit" id="botao">
            Cadastrar paciente
        </button>

    </form>

    <h2>Pacientes cadastrados</h2>

    <div id="listaPacientes"></div>
<hr>

<h2>Agendamento</h2>

<form class="formulario" id="formulario-agendamento">

    <select id="pacienteAgendamento" required>
        <option value="">Selecione o paciente</option>
    </select>

    <input
        type="date"
        id="dataAgendamento"
        required
    >

    <input
        type="time"
        id="horaAgendamento"
        required
    >

    <input
        type="text"
        id="profissional"
        placeholder="Nome do profissional"
        required
    >

    <input
        type="text"
        id="tipoAtendimento"
        placeholder="Tipo de atendimento"
        required
    >

    <button type="submit">
        Agendar
    </button>

</form>

<h2>Agendamentos</h2>

<div id="listaAgendamentos"></div>
</main>

<script>

    let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];

    let pacienteEditando = -1;

    const formulario = document.getElementById("formulario-paciente");

    const lista = document.getElementById("listaPacientes");

    const botao = document.getElementById("botao");


    function mostrarPacientes() {

        lista.innerHTML = "";

        pacientes.forEach(function(paciente, indice) {

            const div = document.createElement("div");

            div.className = "paciente";

            div.innerHTML =

                "<strong>" + paciente.nome + "</strong><br>" +

                "CPF: " + paciente.cpf + "<br>" +

                "Data de nascimento: " + paciente.dataNascimento + "<br>" +

                "Telefone: " + paciente.telefone + "<br>" +

                "E-mail: " + paciente.email +

                '<div class="botoes">' +

                '<button class="editar" onclick="editarPaciente(' + indice + ')">Editar</button>' +

                '<button class="excluir" onclick="excluirPaciente(' + indice + ')">Excluir</button>' +

                '</div>';


            lista.appendChild(div);

        });

    }


    formulario.addEventListener("submit", function(event) {

        event.preventDefault();


        const paciente = {

            nome: document.getElementById("nome").value,

            cpf: document.getElementById("cpf").value,

            dataNascimento: document.getElementById("dataNascimento").value,

            telefone: document.getElementById("telefone").value,

            email: document.getElementById("email").value

        };


        if (pacienteEditando === -1) {

            pacientes.push(paciente);

            alert("Paciente cadastrado com sucesso!");

        } else {

            pacientes[pacienteEditando] = paciente;

            pacienteEditando = -1;

            botao.textContent = "Cadastrar paciente";

            alert("Paciente atualizado com sucesso!");

        }


        localStorage.setItem("pacientes", JSON.stringify(pacientes));

        formulario.reset();

        mostrarPacientes();

    });


    function editarPaciente(indice) {

        const paciente = pacientes[indice];


        document.getElementById("nome").value = paciente.nome;

        document.getElementById("cpf").value = paciente.cpf;

        document.getElementById("dataNascimento").value = paciente.dataNascimento;

        document.getElementById("telefone").value = paciente.telefone;

        document.getElementById("email").value = paciente.email;


        pacienteEditando = indice;

        botao.textContent = "Salvar alterações";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    function excluirPaciente(indice) {

        const confirmar = confirm(

            "Tem certeza que deseja excluir este paciente?"

        );


        if (confirmar) {

            pacientes.splice(indice, 1);

            localStorage.setItem(

                "pacientes",

                JSON.stringify(pacientes)

            );

            mostrarPacientes();
            function carregarPacientesNoAgendamento() {

    const select = document.getElementById("pacienteAgendamento");

    select.innerHTML = '<option value="">Selecione o paciente</option>';

    pacientes.forEach(function(paciente, indice) {

        const option = document.createElement("option");

        option.value = indice;

        option.textContent = paciente.nome;

        select.appendChild(option);

    });

}

carregarPacientesNoAgendamento();

            alert("Paciente excluído com sucesso!");

        }

    }


    mostrarPacientes();
const formularioAgendamento = document.getElementById("formulario-agendamento");

let agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

const listaAgendamentos = document.getElementById("listaAgendamentos");


formularioAgendamento.addEventListener("submit", function(event) {

    event.preventDefault();

    const indicePaciente = document.getElementById("pacienteAgendamento").value;

    const agendamento = {

        paciente: pacientes[indicePaciente].nome,

        data: document.getElementById("dataAgendamento").value,

        hora: document.getElementById("horaAgendamento").value,

        profissional: document.getElementById("profissional").value,

        tipo: document.getElementById("tipoAtendimento").value

    };

    agendamentos.push(agendamento);

    localStorage.setItem(
        "agendamentos",
        JSON.stringify(agendamentos)
    );

    mostrarAgendamentos();

    formularioAgendamento.reset();

    alert("Agendamento realizado com sucesso!");

});


function mostrarAgendamentos() {

    listaAgendamentos.innerHTML = "";

    agendamentos.forEach(function(agendamento, indice) {

        const div = document.createElement("div");

        div.className = "paciente";

        div.innerHTML =

            "<strong>" + agendamento.paciente + "</strong><br>" +

            "Data: " + agendamento.data + "<br>" +

            "Horário: " + agendamento.hora + "<br>" +

            "Profissional: " + agendamento.profissional + "<br>" +

            "Atendimento: " + agendamento.tipo;


        listaAgendamentos.appendChild(div);

    });

}


mostrarAgendamentos();
</script>

</body>

</html>
